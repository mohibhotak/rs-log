name: Generate RS Ratings

# MBH-kopia av Fred6725/relative-strength (Apache-2.0).
# Skillnad mot originalet: CSV-filerna committas i DETTA repo (output/), ingen extra token,
# ingen push till rs-log eller TradingView-seeds.
# 2026-11-26 (MBH steg 3): Alpaca-reserv (alpaca_reserv.py) for tickers som Yahoo inte levererar.
#   Secrets ALPACA_KEY_ID / ALPACA_SECRET. Sparr: under 90 % tackning -> jobbet fallerar, inget committas.
# 22:15 UTC mandag-fredag = 17:15 New York vintertid (efter stangning), fore SectorFlow-natten (03:00 Stockholm).

on:
  schedule:
    - cron: '15 22 * * 1-5'
  workflow_dispatch:
    inputs:
      simulera_batcher:
        description: 'KONTROLL: antal Yahoo-batcher som simuleras som avbrott (0 = normal korning). >0 committar INGENTING.'
        required: false
        default: '0'
      kontroll_fel:
        description: 'KONTROLL: 1 = lagg in ett kant fel (+5 %) som maste upptackas'
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: rs-repo-write
  cancel-in-progress: false

jobs:
  generate-rs:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run relative strength calculation
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          RS_SIMULERA_YAHOO_BATCHER: ${{ github.event.inputs.simulera_batcher || '0' }}
          RS_KONTROLL_FEL: ${{ github.event.inputs.kontroll_fel || '0' }}
        run: python relative-strength.py true

      - name: Check outputs exist
        run: |
          for f in rs_stocks.csv rs_industries.csv; do
            test -s "output/$f" || { echo "output/$f saknas eller ar tom"; exit 1; }
          done
          head -3 output/rs_industries.csv

      - name: Commit outputs and ticker_info cache
        # Provkorningar (simulerat Yahoo-avbrott) committar aldrig
        if: ${{ (github.event.inputs.simulera_batcher || '0') == '0' }}
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add -f output/rs_stocks.csv output/rs_stocks_1.csv output/rs_stocks_2.csv output/rs_industries.csv output/RSRATING.csv data_persist/ticker_info.json || true
          git diff --staged --quiet || git commit -m "RS Ratings update $(date -u +'%Y-%m-%d')"
          git pull --rebase
          git push
